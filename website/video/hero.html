<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buoy, one island</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="site.css">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: #FFFFFF; color: #0B0B0C; font-family: Geist, system-ui, sans-serif; --buoy-font: Geist, system-ui, sans-serif; }
.stage { position: fixed; inset: 0; overflow: hidden; }
/* The island hangs from a fixed point, as it does at the top of a page. */
.cell { position: absolute; left: 0; right: 0; top: 58px; height: 0; contain: layout; }
.cell .buoy { position: absolute; left: 50%; top: 0; }
/* Rings around that point, as behind the homepage's hero. */
.stage .ripples { position: absolute; inset: 0; height: auto; z-index: 0; -webkit-mask-image: none; mask-image: none; }
.stage .ripples i, .stage .ripples b { top: 80px; }
.mark { position: absolute; left: 22px; top: 18px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
.mark svg { width: 22px; height: 22px; }
.mark .ring { fill: none; stroke: #5EEAD4; stroke-width: 4.5; stroke-linecap: round; stroke-dasharray: 54 70; }
.mark .pill { fill: #0B0B0C; }
.foot { position: absolute; left: 0; right: 0; bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 9px; transition: opacity 0.4s ease; }
.label, .code { position: relative; display: grid; justify-items: center; }
.label > span, .code > span { grid-area: 1 / 1; white-space: nowrap; animation: cap-in 0.36s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.label > .is-leaving, .code > .is-leaving { animation: cap-out 0.22s ease-in both; }
.label { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; color: #115E59; }
.code { font: 400 11.5px/1 "Geist Mono", ui-monospace, monospace; color: #27272A; }
.code > span { padding: 9px 13px; border-radius: 10px; background: #F6F6F7; }
@keyframes cap-in { from { opacity: 0; transform: translateY(5px); } }
@keyframes cap-out { to { opacity: 0; transform: translateY(-4px); } }
.word { position: absolute; left: 0; right: 0; top: 138px; display: flex; flex-direction: column; align-items: center; gap: 12px; opacity: 0; transform: translateY(12px); transition: opacity 0.6s ease 0.25s, transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.25s; text-align: center; }
.word h1 { margin: 0; font-size: 150px; line-height: 0.92; font-weight: 700; letter-spacing: -0.075em; }
.word p { margin: 0; max-width: 380px; font-size: 19px; line-height: 1.2; font-weight: 500; letter-spacing: -0.03em; }
.word p span { color: #71717A; }
:root[data-end="true"] .word { opacity: 1; transform: none; }
:root[data-end="true"] .foot { opacity: 0; }
</style>
</head>
<body>
<div class="stage">
<div class="ripples" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="mark"><svg viewBox="0 0 32 32" aria-hidden="true"><circle class="ring" cx="16" cy="16" r="11" transform="rotate(-60 16 16)"/><rect class="pill" x="9" y="12.5" width="14" height="7" rx="3.5"/></svg><span>Buoy</span></div>
<div class="cell"></div>
<div class="word"><h1>Buoy</h1><p>An island for your notifications, promises <span>and background work.</span></p></div>
<div class="foot"><div class="label"></div><div class="code"></div></div>
</div>
<script src="hero.js"></script>
</body>
</html>
