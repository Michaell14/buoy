name: Release

# Publishes buoy-ui to npm when a version tag such as v0.1.0 is pushed.
# Needs an NPM_TOKEN repository secret: an npm granular access token with read and write access to packages.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm record where the package was built (provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      # prepublishOnly runs the typecheck, tests and build first.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
