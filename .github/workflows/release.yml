name: Release

# Stages a new buoy-ui version on npm whenever package.json on main has a version that isn't
# published yet, then tags the commit (v1.2.3). A maintainer approves the staged version on
# npmjs.com (Staged Packages tab, with two-factor) to make it live.
#
# Uses npm trusted publishing, so there is no token: on npmjs.com, buoy-ui → Settings →
# Trusted Publisher → GitHub Actions, user Michaell14, repository buoy, workflow release.yml.

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write # to push the version tag
  id-token: write # trusted publishing: npm trusts this workflow's GitHub identity

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Staged publishing needs npm 11.15 or later.
      - run: npm install --global npm@11

      - name: Check whether this version is new
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "buoy-ui@$version" version > /dev/null 2>&1; then
            echo "buoy-ui@$version is already on npm, nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.new == 'true'
        run: npm ci

      - name: Typecheck, test and build
        if: steps.version.outputs.new == 'true'
        run: npm run check

      - if: steps.version.outputs.new == 'true'
        run: npm stage publish

      - name: Tag the release
        if: steps.version.outputs.new == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
