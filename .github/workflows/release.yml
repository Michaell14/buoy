name: Release

# Publishes buoy-ui to npm whenever main has a version that isn't on npm yet, then tags
# that commit (v1.2.3). To release, bump "version" in package.json and push to main.
# Needs an NPM_TOKEN repository secret: an npm granular access token with read and write access to packages.

on:
  push:
    branches: [main]

permissions:
  contents: write # to push the version tag
  id-token: write # lets npm record where the package was built (provenance)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check whether this version is new
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "buoy-ui@$version" version > /dev/null 2>&1; then
            echo "buoy-ui@$version is already on npm, nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.new == 'true'
        run: npm ci

      # prepublishOnly runs the typecheck, tests and build first.
      - if: steps.version.outputs.new == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the release
        if: steps.version.outputs.new == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
