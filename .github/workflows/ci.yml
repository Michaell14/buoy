name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pushes cover branches in this repo. Pull requests only run for forks, so a branch here isn't tested twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build the website
        run: npm run site:build

      - name: Check the package (exports, types, metadata)
        if: matrix.node == 24
        run: npm run lint:package
